display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px #000a}

</style></head><body>
<div class="sky"></div><div class="ridge"></div>
<header><a class="brand" href="#/">Class Wiki</a><nav id="nav"></nav></header>
<main><div class="crumbs" id="crumbs"></div><div id="page"></div></main>
<button class="fab" id="fab" hidden>Ask Claude</button>
<aside class="chat" id="chat" aria-label="Ask Claude about this class" hidden>
  <div class="chat-top"><strong>Ask Claude</strong><button id="chatx" aria-label="Close chat">✕</button></div>
  <div class="chat-log" id="chatlog" aria-live="polite"><p class="k">Answers come from this class's wiki. Each question uses your Claude plan.</p></div>
  <form id="chatf"><label class="mode"><input type="checkbox" name="quiz"> Quiz me (Claude asks, you answer, it counts toward weak spots)</label>
    <input type="text" name="q" placeholder="Ask about this class" required autocomplete="off"><button>Send</button></form>
</aside>
<script>
const page = document.getElementById("page"), nav = document.getElementById("nav"), byId = id => document.getElementById(id);
const H = {"X-Class-Wiki": "1"};  // the server refuses writes without it (blocks other websites)
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
let timer;

nav.innerHTML = '<a href="#/">Classes</a> <a href="#/calendar">Calendar</a> <a href="#/wiki/index.md">Index</a> <a href="#/wiki/log.md">Log</a>';

async function post(url, body) {  // body: a File, or an object sent as JSON
  const r = await fetch(url, {method: "POST", headers: H, body: body instanceof File ? body : JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

const delBtn = (path, title, warn) => `<button class="del" data-del="${esc(path)}" data-msg="${esc(warn + ' It moves to the .trash folder.')}" title="Delete" aria-label="Delete ${esc(title)}">✕</button>`;
const scorePill = r => {  // a quiz's score on its card: green 80%+, red under 50%
  if (!r) return "";
  const f = r.right / Math.max(r.done, 1);
  return `<span class="score ${r.done < r.of ? "mid" : f >= .8 ? "good" : f < .5 ? "low" : "mid"}">${r.done < r.of ? `${r.done}/${r.of} done` : `${r.right}/${r.of}`}</span>`;
};
page.addEventListener("click", async e => {  // every ✕ button on the class page
  const b = e.target.closest("[data-del]");
  if (!b) return;
  e.preventDefault();
  if (!confirm(b.dataset.msg)) return;
  b.disabled = true;
  try { await post("/api/delete", {class: page.dataset.cls, path: b.dataset.del}); } catch (x) { alert(x.message); }
  page.reload?.();
});

const ACCENT = ["#e0873a", "#7fa35c", "#4f9db8", "#9a7bd0", "#c4664a", "#c9a24a"];  // ember, moss, glacier, dusk, clay, ochre

const when = d => d === 0 ? "today" : d === 1 ? "tomorrow" : `in ${d} days`;
const dueLine = i => i ? `<div class="due${i.days <= 7 ? " soon" : ""}"><b>${esc(i.title)}</b> ${when(i.days)}${i.weight_pct ? ` · ${+i.weight_pct}% of grade` : ""}</div>` : "";

async function calendar() {
  const rows = await (await fetch("/api/calendar")).json();
  let month = new Date(); month.setDate(1);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const draw = () => {
    const first = new Date(month), start = new Date(first); start.setDate(1 - first.getDay());
    const cells = [];
    for (let d = new Date(start); cells.length < 42; d.setDate(d.getDate() + 1)) {
      const day = iso(d);
      cells.push(`<div class="day${d.getMonth() !== first.getMonth() ? " off" : ""}${day === iso(new Date()) ? " today" : ""}"><span>${d.getDate()}</span>` +
        rows.filter(r => r.due_date === day).map(r => `<a class="ev${r.type === "exam" ? " exam" : ""}" style="--acc:${ACCENT[r.idx % ACCENT.length]}" href="#/c/${esc(r.class)}/deadlines"
          title="${esc(r.name)}: ${esc(r.title)}${r.weight_pct ? ` (${+r.weight_pct}% of grade)` : ""}">${esc(r.title)}</a>`).join("") + "</div>");
    }
    const seen = [...new Map(rows.map(r => [r.class, r])).values()];
    page.innerHTML = `<div class="k">Every class</div><h1>Calendar</h1>
      <div class="cal-top"><button class="ghost" id="prev" aria-label="Last month">←</button><h2>${first.toLocaleString("en-US", {month: "long", year: "numeric"})}</h2>

  }
  refresh();
}

// math first: marked would eat the _ and \ inside $...$, so swap each formula for a placeholder, then put KaTeX back
marked.use({breaks: true});  // wiki metadata is one "> Key: value" per line
function render(md) {
  const math = [];
  const safe = md.replace(/(`+)[\s\S]*?\1|\$\$([\s\S]+?)\$\$|\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (m, tick, block, inline) => {
    if (tick) return m;
    math.push(katex.renderToString(block ?? inline, {displayMode: !!block, throwOnError: false}));
    return `@@MATH${math.length - 1}@@`;
  });
  return marked.parse(safe).replace(/@@MATH(\d+)@@/g, (_, i) => math[i]);
}

async function doc(path, sec) {
  const r = await fetch("/" + path + "?raw=1");
  const md = r.ok ? await r.text() : "";
  page.innerHTML = `<div class="doc"><div id="body">` + (r.ok ? render(md) : "<h1>Not found</h1>") + "</div></div>";
  if (path === "wiki/index.md" && !md.includes("](")) {
    page.firstChild.insertAdjacentHTML("beforeend", '<p class="note">No pages yet. Open a class and add a source.</p>');
  }
  // wiki links are relative to the current file: .md → viewer route, everything else → the real file
  for (const a of page.querySelectorAll("a[href]")) {
    const h = a.getAttribute("href");
    if (/^([a-z]+:|#)/i.test(h)) continue;
    const u = new URL(h, location.origin + "/" + path);
    a.href = u.pathname.endsWith(".md") ? "#" + u.pathname : u.pathname;
  }
  document.title = (page.querySelector("h1")?.textContent || path) + " · Class Wiki";
  setCur(page.querySelector("h1")?.textContent || path);
  const cls = r.ok && path.match(/^wiki\/([\w-]+)\/[\w.-]+\.md$/);
  if (cls) await practice(path, cls[1]);
  const h = sec && [...page.querySelectorAll("h2,h3")].find(h => h.textContent.trim() === sec);
  if (h) setTimeout(() => {  // quiz source link: flash the whole section you missed, heading down to the next heading
    h.scrollIntoView();
    for (let e = h; e && (e === h || !/^H[1-3]$/.test(e.tagName)); e = e.nextElementSibling) e.classList.add("flash");
  });
}

// Study the page the hard way (PSC 001 desirable difficulties): pre-test, blank-page recall, summary.
const store = {get: k => { try { return localStorage.getItem(k); } catch {} }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
async function practice(path, slug) {
  const body = document.getElementById("body");
  body.insertAdjacentHTML("beforebegin", `<div class="practice" id="pr"><div class="row">
    <button data-k="recall">Recall from memory</button><button class="ghost" data-k="summary">Write a summary</button></div>
    <p class="k" id="prnote">Recall = close the page and write all you remember. Claude shows what you missed. Uses your Claude plan.</p>
    <div id="prwork" hidden><p id="prhelp"></p><textarea id="prtext"></textarea>
      <div class="row"><button id="prcheck">Check with Claude</button><button class="ghost" id="prshow">Show the page</button></div></div>
    <div class="fb" id="prfb" hidden></div></div>`);
  const $ = id => document.getElementById(id), seen = "seen:" + path, recalled = "recalled:" + path;
  if (store.get(seen) && !(store.get(recalled) > store.get(seen))) {  // back to re-read without trying first
    $("prnote").innerHTML = "<strong>Try recall first.</strong> Re-reading feels like learning but does not stick. The best time to re-read is the 10 minutes before a test.";
  }
  store.set(seen, Date.now());
  const HELP = {
    recall: "The page is hidden. Write everything you remember about it. Mistakes are fine: they show you what to learn.",
    summary: "Write a summary in your own words: the question, the evidence, the conclusion. The page is hidden so you do not copy it.",
  };
  let kind;
  const hide = on => { body.hidden = on; $("prwork").hidden = !on; };
  $("pr").querySelector(".row").onclick = e => {
    if (!(kind = e.target.dataset.k)) return;
    hide(true); $("prfb").hidden = true;
    $("prhelp").textContent = HELP[kind]; $("prtext").value = ""; $("prtext").focus();
  };
  $("prshow").onclick = () => hide(false);
  $("prcheck").onclick = async () => {
    const text = $("prtext").value.trim(), b = $("prcheck");
    if (!text) return $("prtext").focus();
    b.disabled = true; b.textContent = "Claude is checking…";
    try {
      const d = await post("/api/grade", {class: slug, source: path, kind, text});
      post("/api/score", {class: slug, source: path, ok: d.ok}).catch(() => {});
      if (kind === "recall") store.set(recalled, Date.now() + 1);
      $("prfb").innerHTML = `<strong>${d.ok ? "Good." : "Not yet. Now compare with the page."}</strong>` + render(d.feedback);
      $("prfb").hidden = false; body.hidden = false;
    } catch (x) { $("prfb").textContent = x.message; $("prfb").hidden = false; }
    b.disabled = false; b.textContent = "Check with Claude";
  };

  // Pre-test: a page you never practiced asks 3 questions first. Credit for trying, not for being right.
  const scores = await fetch(`/studio/${slug}/scores.json`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  if (scores[path] || store.get("pretest:" + path)) return;
  const qs = await (await fetch("/api/questions?page=" + encodeURIComponent(path))).json();
  if (!qs.length) return;
  body.hidden = true;
  body.insertAdjacentHTML("beforebegin", `<div class="practice" id="pre"><h2>Test yourself first</h2>
    <p class="k">New page. Guess before you read: trying (even wrong) makes the page stick. Nothing is graded.</p>` +
    qs.map((q, i) => `<p>${i + 1}. ${esc(q.q)}</p><textarea data-i="${i}" placeholder="Your best guess"></textarea>`).join("") +
    `<div class="row"><button id="predone">Show answers and the page</button><button class="ghost" id="preskip">Skip</button></div></div>`);
  const end = () => { store.set("pretest:" + path, 1); body.hidden = false; };
  $("preskip").onclick = () => { $("pre").remove(); end(); };
  $("predone").onclick = () => {
    for (const t of $("pre").querySelectorAll("textarea")) {
      const q = qs[t.dataset.i];
      t.insertAdjacentHTML("afterend", `<p class="snip">Answer: ${esc(q.type === "mcq" ? q.choices[q.answer] : q.answer)}</p>`);
      t.disabled = true;
    }
    $("predone").parentElement.remove(); end();
  };
}

// Where "up" is, and the breadcrumb, for each kind of page
let names;
const cur = text => `<span class="cur" id="cur">${esc(text)}</span>`;
const setCur = t => { const c = byId("cur"); if (c) c.textContent = t; };
function where(route) {
  const cls = m => `<a href="#/c/${m}">${esc(names[m] || m)}</a>`;
  let m;
  if ((m = route.match(/^c\/([\w-]+)(?:\/(\w+))?$/))) return {up: "#/", trail: `<a href="#/">Classes</a> › ${cur(names[m[1]] || m[1])}`};
  if ((m = route.match(/^(?:view\/)?(?:wiki|raw|studio)\/([\w-]+)\/(.*)$/))) {
    const tab = /^view\/|^studio/.test(route) ? "study" : route.startsWith("raw") ? "sources" : "wiki";
    const label = {wiki: "Wiki", sources: "Sources", study: "Study"}[tab];
    return {up: `#/c/${m[1]}/${tab}`, trail: `<a href="#/">Classes</a> › ${cls(m[1])} › <a href="#/c/${m[1]}/${tab}">${label}</a> › ${cur(m[2].split("/").pop())}`};
  }
  return {up: "#/", trail: `<a href="#/">Classes</a> › ${cur(route.split("/").pop())}`};
}
function crumbs(route) {
  const box = byId("crumbs");
  if (!route) return box.innerHTML = "";
  const w = where(route);
  box.innerHTML = `<button class="back" id="back" aria-label="Go back">← Back</button><nav class="trail">${w.trail}</nav>` +
    (route.startsWith("view/") ? `<a class="ext" href="/${esc(route.slice(5))}" target="_blank">Open in a new tab ↗</a>` : "");
  byId("back").onclick = () => history.length > 1 && document.referrer.startsWith(location.origin) || trail > 1 ? history.back() : (location.hash = w.up);
}

async function view(path) {  // a quiz, deck, slides, audio... inside the site, so the header and Back button stay
  page.innerHTML = `<div class="frame"><iframe src="/${esc(path)}" title="Study output"></iframe></div>`;
  document.title = path.split("/").pop() + " · Class Wiki";
  page.querySelector("iframe").onload = e => setCur(e.target.contentDocument?.title || path.split("/").pop());
}

let trail = 0;  // pages seen since this tab opened: 1 means opened directly, so Back goes "up" instead of out of the site
async function show() {
  trail++;
  const [route, sec] = location.hash.slice(2).split("#").map(decodeURIComponent);
  const m = route.match(/^c\/([\w-]+)(?:\/(\w+))?$/);
  if (m && page.dataset.cls === m[1]) {  // another tab of the same class: keep the page, its search boxes and its refresh loop
    setTab(m[2]); crumbs(route);
    for (const a of nav.querySelectorAll("a")) a.classList.toggle("on", a.getAttribute("href") === location.hash);
    return;
  }
  clearTimeout(timer);
  page.dataset.cls = "";
  byId("fab").hidden = byId("chat").hidden = true;  // chat lives on class pages only
  const slug = m ? m[1] : (route.match(/^(?:view\/)?(?:wiki|raw|studio)\/([\w-]+)\//) || [])[1];
  if (!names || (slug && !names[slug])) names = Object.fromEntries((await (await fetch("/api/classes")).json()).map(c => [c.slug, c.name]));
  document.querySelector("main").classList.toggle("wide", route.startsWith("view/"));
  crumbs(route);
  if (m) await klass(m[1], m[2]);
  else if (route === "calendar") { document.title = "Calendar · Class Wiki"; await calendar(); }
  else if (route.startsWith("view/")) await view(route.slice(5));
  else if (route.endsWith(".md")) await doc(route, sec);
  else { document.title = "Class Wiki"; await home(); }
  for (const a of nav.querySelectorAll("a")) a.classList.toggle("on", a.getAttribute("href") === location.hash);
  page.classList.remove("in"); void page.offsetWidth; page.classList.add("in");
  if (!sec) scrollTo(0, 0);
}
addEventListener("hashchange", show);
show();
</script></body></html>
